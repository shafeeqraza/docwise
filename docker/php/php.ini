; Document uploads (PDF/DOCX/TXT) go through the API.
upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 512M
max_execution_time = 300

; Dev opcache: re-check changed files at most every 2s. Checking on every request
; (revalidate_freq=0) means a stat per file over the slow host bind mount.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
